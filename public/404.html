<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // SPA fallback for static hosting (Render, GitHub Pages, etc.)
      // Stores the requested path and redirects to root so the SPA router can handle it
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('spa-redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body>
    <noscript>
      <p>Page not found. <a href="/">Return to homepage</a></p>
    </noscript>
  </body>
</html>
